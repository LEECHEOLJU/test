services:
  - type: web
    name: cgv-imax-alert
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 4 app_v2:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      - key: USE_MOCK_CRAWLER
        value: False
      - key: DATABASE_URL
        fromDatabase:
          name: cgv-alert-db
          property: connectionString

databases:
  - name: cgv-alert-db
    plan: free
    databaseName: cgv_alert
    user: cgv_user
