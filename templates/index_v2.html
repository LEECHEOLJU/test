{% extends "base.html" %}

{% block title %}CGV IMAX 예매 알림 - 홈{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto" x-data="movieMonitor()">
    <!-- 상태 헤더 -->
    <div class="mb-8 animate-slide-up">
        <div class="card">
            <div class="flex items-center justify-between">
                <div>
                    <h2 class="text-3xl font-bold text-gray-800 dark:text-white mb-2">
                        🎬 영화 모니터링 시스템
                    </h2>
                    <p class="text-gray-600 dark:text-gray-400">
                        CGV 용산 IMAX 예매 오픈을 실시간으로 감지합니다
                    </p>
                </div>
                <div class="text-right">
                    <div class="flex items-center space-x-2" :class="monitoringActive ? 'text-green-600' : 'text-gray-400'">
                        <div class="w-3 h-3 rounded-full" :class="monitoringActive ? 'bg-green-500 animate-pulse' : 'bg-gray-400'"></div>
                        <span class="font-semibold" x-text="monitoringActive ? '모니터링 중' : '대기 중'"></span>
                    </div>
                    <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">
                        모니터링 영화: <span x-text="monitoredCount"></span>개
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- 제어 패널 -->
    <div class="mb-8 animate-slide-up" style="animation-delay: 0.1s">
        <div class="card">
            <h3 class="text-xl font-bold text-gray-800 dark:text-white mb-4">제어 패널</h3>
            <div class="flex space-x-4">
                <button
                    @click="startMonitoring()"
                    :disabled="monitoringActive || monitoredCount === 0"
                    class="btn-primary disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg class="w-5 h-5 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    모니터링 시작
                </button>
                <button
                    @click="stopMonitoring()"
                    :disabled="!monitoringActive"
                    class="bg-gradient-to-r from-red-600 to-pink-600 text-white px-6 py-3 rounded-lg font-semibold hover:from-red-700 hover:to-pink-700 transition-all duration-300 shadow-lg hover:shadow-xl disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg class="w-5 h-5 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"></path>
                    </svg>
                    모니터링 중지
                </button>
                <button
                    @click="refreshMovies()"
                    class="btn-secondary">
                    <svg class="w-5 h-5 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    새로고침
                </button>
            </div>
        </div>
    </div>

    <!-- 영화 목록 -->
    <div class="animate-slide-up" style="animation-delay: 0.2s">
        <div class="card">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-bold text-gray-800 dark:text-white">
                    상영 영화 목록
                </h3>
                <span class="text-sm text-gray-500 dark:text-gray-400">
                    총 <span x-text="movies.length"></span>개 영화
                </span>
            </div>

            <!-- 로딩 상태 -->
            <div x-show="loading" class="text-center py-12">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-purple-600"></div>
                <p class="mt-4 text-gray-600 dark:text-gray-400">영화 목록을 불러오는 중...</p>
            </div>

            <!-- 영화 그리드 -->
            <div x-show="!loading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <template x-for="movie in movies" :key="movie.id">
                    <div
                        class="border-2 rounded-xl p-4 cursor-pointer transition-all duration-300 hover:shadow-lg"
                        :class="movie.is_monitoring ? 'border-purple-500 bg-purple-50 dark:bg-purple-900 dark:bg-opacity-20' : 'border-gray-200 dark:border-gray-700 hover:border-purple-300'"
                        @click="toggleMovie(movie.id)">
                        <div class="flex items-start space-x-4">
                            <!-- 포스터 -->
                            <div class="flex-shrink-0">
                                <img
                                    :src="movie.poster_url || '/static/default-poster.png'"
                                    :alt="movie.title"
                                    class="w-20 h-28 object-cover rounded-lg shadow-md"
                                    onerror="this.src='/static/default-poster.png'">
                            </div>

                            <!-- 영화 정보 -->
                            <div class="flex-1 min-w-0">
                                <div class="flex items-start justify-between">
                                    <h4 class="font-bold text-gray-800 dark:text-white text-lg mb-2 truncate" x-text="movie.title"></h4>
                                    <input
                                        type="checkbox"
                                        :checked="movie.is_monitoring"
                                        class="w-5 h-5 text-purple-600 rounded focus:ring-2 focus:ring-purple-500"
                                        @click.stop="toggleMovie(movie.id)">
                                </div>
                                <div class="space-y-1 text-sm text-gray-600 dark:text-gray-400">
                                    <p x-show="movie.rating">
                                        <span class="font-semibold">등급:</span> <span x-text="movie.rating"></span>
                                    </p>
                                    <p x-show="movie.genre">
                                        <span class="font-semibold">장르:</span> <span x-text="movie.genre"></span>
                                    </p>
                                    <p x-show="movie.runtime">
                                        <span class="font-semibold">러닝타임:</span> <span x-text="movie.runtime"></span>분
                                    </p>
                                    <p x-show="movie.director">
                                        <span class="font-semibold">감독:</span> <span x-text="movie.director"></span>
                                    </p>
                                </div>
                                <div x-show="movie.is_monitoring" class="mt-3">
                                    <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-purple-600 text-white">
                                        <svg class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20">
                                            <path d="M10 12a2 2 0 100-4 2 2 0 000 4z"></path>
                                            <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"></path>
                                        </svg>
                                        모니터링 중
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

            <!-- 빈 상태 -->
            <div x-show="!loading && movies.length === 0" class="text-center py-12">
                <svg class="w-16 h-16 mx-auto text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"></path>
                </svg>
                <p class="text-gray-600 dark:text-gray-400">상영 중인 영화가 없습니다</p>
            </div>
        </div>
    </div>

    <!-- 최근 알림 -->
    <div class="mt-8 animate-slide-up" style="animation-delay: 0.3s" x-show="recentNotifications.length > 0">
        <div class="card">
            <h3 class="text-xl font-bold text-gray-800 dark:text-white mb-4">최근 알림</h3>
            <div class="space-y-3">
                <template x-for="notification in recentNotifications" :key="notification.id">
                    <div class="flex items-center justify-between p-4 bg-gray-50 dark:bg-gray-700 rounded-lg">
                        <div class="flex items-center space-x-4">
                            <div class="flex-shrink-0">
                                <svg class="w-8 h-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                </svg>
                            </div>
                            <div>
                                <p class="font-semibold text-gray-800 dark:text-white" x-text="notification.movie_title"></p>
                                <p class="text-sm text-gray-600 dark:text-gray-400" x-text="notification.notification_type + ' 알림 발송 완료'"></p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-sm text-gray-500 dark:text-gray-400" x-text="formatDate(notification.sent_at)"></p>
                            <a :href="notification.booking_url" target="_blank" class="text-xs text-purple-600 hover:text-purple-700">예매 링크</a>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
function movieMonitor() {
    return {
        movies: [],
        loading: true,
        monitoringActive: false,
        monitoredCount: 0,
        recentNotifications: [],
        eventSource: null,

        init() {
            this.loadMovies();
            this.loadStatus();
            this.loadRecentNotifications();
            this.connectSSE();
        },

        async loadMovies() {
            this.loading = true;
            try {
                const response = await fetch('/api/v2/movies');
                const data = await response.json();
                if (data.success) {
                    this.movies = data.movies;
                    this.updateMonitoredCount();
                }
            } catch (error) {
                console.error('영화 목록 로드 실패:', error);
                showToast('영화 목록을 불러올 수 없습니다', 'error');
            } finally {
                this.loading = false;
            }
        },

        async loadStatus() {
            try {
                const response = await fetch('/api/v2/monitoring/status');
                const data = await response.json();
                if (data.success) {
                    this.monitoringActive = data.active;
                }
            } catch (error) {
                console.error('상태 로드 실패:', error);
            }
        },

        async loadRecentNotifications() {
            try {
                const response = await fetch('/api/v2/notifications?per_page=5');
                const data = await response.json();
                if (data.success) {
                    this.recentNotifications = data.notifications;
                }
            } catch (error) {
                console.error('알림 로드 실패:', error);
            }
        },

        async toggleMovie(movieId) {
            try {
                const response = await fetch(`/api/v2/movies/${movieId}/monitor`, {
                    method: 'POST'
                });
                const data = await response.json();
                if (data.success) {
                    await this.loadMovies();
                    showToast('영화 모니터링 설정이 변경되었습니다', 'success');
                }
            } catch (error) {
                console.error('영화 토글 실패:', error);
                showToast('설정 변경에 실패했습니다', 'error');
            }
        },

        async startMonitoring() {
            try {
                const response = await fetch('/api/v2/monitoring/start', {
                    method: 'POST'
                });
                const data = await response.json();
                if (data.success) {
                    this.monitoringActive = true;
                    showToast('모니터링을 시작했습니다', 'success');
                }
            } catch (error) {
                console.error('모니터링 시작 실패:', error);
                showToast('모니터링 시작에 실패했습니다', 'error');
            }
        },

        async stopMonitoring() {
            try {
                const response = await fetch('/api/v2/monitoring/stop', {
                    method: 'POST'
                });
                const data = await response.json();
                if (data.success) {
                    this.monitoringActive = false;
                    showToast('모니터링을 중지했습니다', 'info');
                }
            } catch (error) {
                console.error('모니터링 중지 실패:', error);
                showToast('모니터링 중지에 실패했습니다', 'error');
            }
        },

        refreshMovies() {
            this.loadMovies();
            showToast('영화 목록을 새로고침했습니다', 'success');
        },

        updateMonitoredCount() {
            this.monitoredCount = this.movies.filter(m => m.is_monitoring).length;
        },

        connectSSE() {
            this.eventSource = new EventSource('/api/stream');

            this.eventSource.addEventListener('monitoring_status', (e) => {
                const data = JSON.parse(e.data);
                this.monitoringActive = data.active;
            });

            this.eventSource.addEventListener('booking_opened', (e) => {
                const data = JSON.parse(e.data);
                showToast(`${data.movie_title} 예매가 오픈되었습니다!`, 'success');
                this.loadRecentNotifications();
            });

            this.eventSource.addEventListener('movie_updated', (e) => {
                this.loadMovies();
            });

            this.eventSource.onerror = (error) => {
                console.error('SSE 연결 오류:', error);
                // 재연결 시도
                setTimeout(() => this.connectSSE(), 5000);
            };
        },

        formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString('ko-KR');
        }
    }
}
</script>
{% endblock %}
