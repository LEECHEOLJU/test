<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGV IMAX 예매 알림 - 로그인</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.6s ease-out;
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full">
        <!-- 로고 -->
        <div class="text-center mb-8 animate-fade-in">
            <svg class="w-20 h-20 mx-auto text-white mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"></path>
            </svg>
            <h1 class="text-3xl font-bold text-white mb-2">CGV IMAX 예매 알림</h1>
            <p class="text-purple-200">CGV 용산 IMAX 예매 오픈 실시간 알림</p>
        </div>

        <!-- 로그인 폼 -->
        <div class="bg-white rounded-2xl shadow-2xl p-8 animate-fade-in" style="animation-delay: 0.2s">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">로그인</h2>

            <form method="POST" action="/login">
                <!-- 사용자명 -->
                <div class="mb-4">
                    <label for="username" class="block text-gray-700 font-semibold mb-2">
                        사용자명
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                        </div>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            required
                            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                            placeholder="username">
                    </div>
                </div>

                <!-- 비밀번호 -->
                <div class="mb-6">
                    <label for="password" class="block text-gray-700 font-semibold mb-2">
                        비밀번호
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                            </svg>
                        </div>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                            placeholder="••••••••">
                    </div>
                </div>

                <!-- 자동 로그인 -->
                <div class="flex items-center mb-6">
                    <input
                        type="checkbox"
                        id="remember"
                        name="remember"
                        class="w-4 h-4 text-purple-600 rounded focus:ring-2 focus:ring-purple-500">
                    <label for="remember" class="ml-2 text-gray-700 text-sm">
                        로그인 상태 유지
                    </label>
                </div>

                <!-- 로그인 버튼 -->
                <button
                    type="submit"
                    class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white py-3 rounded-lg font-semibold hover:from-purple-700 hover:to-indigo-700 transition-all duration-300 shadow-lg hover:shadow-xl">
                    로그인
                </button>
            </form>

            <!-- 에러 메시지 -->
            {% if error %}
            <div class="mt-4 p-4 bg-red-50 border border-red-200 rounded-lg">
                <div class="flex items-center space-x-2 text-red-800">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
                    </svg>
                    <span>{{ error }}</span>
                </div>
            </div>
            {% endif %}

            <!-- 회원가입 링크 (단일 사용자용이므로 비활성화) -->
            <!--
            <div class="mt-6 text-center">
                <p class="text-gray-600 text-sm">
                    계정이 없으신가요?
                    <a href="/register" class="text-purple-600 hover:text-purple-700 font-semibold">
                        회원가입
                    </a>
                </p>
            </div>
            -->

            <!-- 데모 계정 안내 (개발용) -->
            <div class="mt-6 p-4 bg-gray-50 rounded-lg">
                <p class="text-xs text-gray-600 text-center">
                    <strong>개발 모드:</strong> 초기 사용자명/비밀번호는 환경변수로 설정됩니다
                </p>
            </div>
        </div>

        <!-- 푸터 -->
        <div class="text-center mt-8 text-white text-sm animate-fade-in" style="animation-delay: 0.4s">
            <p>© 2025 CGV IMAX Alert System</p>
            <p class="mt-2 text-purple-200">Made with ❤️ for movie lovers</p>
        </div>
    </div>
</body>
</html>
