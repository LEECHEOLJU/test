version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://user:password@db:5432/cgv_alert
      - USE_MOCK_CRAWLER=False
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./:/app
    command: gunicorn --bind 0.0.0.0:5000 --workers 4 app_v2:app

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=cgv_alert
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
